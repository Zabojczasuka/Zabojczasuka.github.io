<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games - JΣΛП</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Inter, sans-serif;
    }

    body {
        background: #0f1117;
        color: white;
        min-height: 100vh;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 40px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .logo {
        font-weight: 700;
        letter-spacing: 2px;
    }

    a {
        color: white;
        text-decoration: none;
    }

    .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 75vh;
        text-align: center;
        padding: 20px;
    }

    .box {
        max-width: 600px;
        padding: 30px;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 14px;
        background: #161a23;
    }

    h1 {
        font-size: 34px;
        margin-bottom: 10px;
    }

    p {
        color: #a6adbb;
        line-height: 1.6;
        margin-bottom: 20px;
    }

    .hint {
        font-size: 13px;
        color: #6c7280;
    }

    .btn {
        display: inline-block;
        margin-top: 15px;
        padding: 10px 16px;
        background: white;
        color: #0f1117;
        border-radius: 10px;
        font-weight: 600;
    }
</style>
</head>

<body>

<header>
    <div class="logo"><a href="index.html">JΣΛП</a></div>
</header>

<div class="container">

    <div class="box">
        <h1>Games</h1>
        <p>
            This is where games will be added.
            Right now the library is big.
        </p>

        <div class="hint">
            Check back later for updates.
        </div>

        <a class="btn" href="index.html">Go Home</a>
    </div>
  <div id="games"></div>

<script
  src="https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js"
></script>
<script>
  Lumin.init({
    container: '#games',
    theme: 'dark'
  });
</script>

</div>

</body>
</html>
