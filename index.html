<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JΣΛП</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Inter, sans-serif;
    }

    body {
        background: #0f1117;
        color: white;
        min-height: 100vh;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 40px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .logo {
        font-weight: 700;
        font-size: 20px;
        letter-spacing: 2px;
    }

    .btn {
        padding: 10px 16px;
        background: #ffffff;
        color: #0f1117;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        transition: 0.2s;
    }

    .btn:hover {
        transform: translateY(-2px);
    }

    .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        height: 80vh;
        padding: 20px;
    }

    .hero h1 {
        font-size: 56px;
        margin-bottom: 15px;
    }

    .hero p {
        max-width: 600px;
        color: #b7bcc9;
        line-height: 1.6;
        margin-bottom: 25px;
    }

    .cta {
        padding: 12px 20px;
        background: linear-gradient(135deg, #4f7cff, #7c4dff);
        color: white;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 600;
    }

    footer {
        text-align: center;
        padding: 20px;
        color: #6c7280;
        border-top: 1px solid rgba(255,255,255,0.06);
    }
</style>
</head>

<body>

<header>
    <div class="logo">JΣΛП</div>
    <a class="btn" href="games.html">Games</a>
</header>

<section class="hero">
    <h1>Play. Instantly.</h1>
    <p>
        A simple, fast game hub built for instant access. No downloads, no delays — just games.
    </p>

    <a class="cta" href="games.html">Enter Games</a>
</section>

<footer>
    © 2026 JΣΛП
</footer>

</body>
</html>
