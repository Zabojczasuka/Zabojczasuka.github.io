<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JΣΛП</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        header {
            background: #2f2f2f;
            color: white;
            padding: 18px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .container {
            padding: 40px;
        }

        .card {
            background: white;
            border: 1px solid #ddd;
            padding: 25px;
            max-width: 600px;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.05);
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #444;
            line-height: 1.5;
        }

        a.button {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 16px;
            background: #2f2f2f;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }

        a.button:hover {
            background: #444;
        }

        footer {
            margin-top: 60px;
            padding: 15px;
            font-size: 13px;
            color: #666;
            text-align: center;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">JΣΛП</div>
</header>

<div class="container">

    <div class="card">
        <h1>Welcome</h1>

            This is JΣΛП — a simple game site where you can play different browser games.

        </p>

        <a class="button" href="games.html">Go to Games</a>

</div>

<footer>

</html>
